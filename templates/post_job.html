{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <!-- Employer Image (jpeg now) -->
        <div class="col-md-6 d-none d-md-block text-center">
            <img src="{% static 'images/employer.jpeg' %}" alt="Employer" class="img-fluid rounded shadow" style="max-width: 80%; height: auto;">
        </div>

        <!-- Post Job Form -->
        <div class="col-md-6">
            <div class="card shadow-lg p-4">
                <h3 class="text-center mb-4">Post a Job</h3>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Job Title</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Company</label>
                        <input type="text" name="company" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Salary</label>
                        <input type="text" name="salary" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" name="location" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Job Description</label>
                        <textarea name="description" rows="4" class="form-control" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Submit Job</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
