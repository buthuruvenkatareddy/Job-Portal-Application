{% extends 'base.html' %}
{% block content %}
<div class="card p-4">
    <h3 class="mb-3">Apply for: <strong>{{ job.title }}</strong></h3>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Submit Application</button>
    </form>
</div>
{% endblock %}
